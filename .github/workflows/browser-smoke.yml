name: Browser smoke tests
on:
  pull_request:
  push:
    branches: [feature/fast-cache-settings-navigation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check JavaScript syntax
        run: find js test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run browser regression tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/sqlime-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          TEST_BASE_URL=http://127.0.0.1:8765 node test/smoke.mjs
